# Шаблон для экспорта MS-DIAL (Alignment result → Export → Area, формат txt).
# Тип пробы (Sample/QC/Blank) и порядок инъекций берутся из строк заголовка экспорта;
# столбец injection_order в metadata.csv (если заполнен) имеет приоритет.
input:
  data: path/to/Area_0_2026_01_01.txt
  format: msdial
  metadata: path/to/metadata.csv      # sample, group, sex, age, include [, exclude_reason, injection_order]
  contaminant_series: null            # необязательно: ряд экзогенных соединений для индекса загрязнения
  exposure_keywords: ../example/exposure_keywords.csv
output: results_R
design:
  groups: [Control, BC]
  comparisons:
    - {name: BC_vs_Control, case: BC, ref: Control}
  covariates: [sex, age]
