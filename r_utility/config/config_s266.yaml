# Параметры UroMetabR для батча s266 (2 этап, статья Analytica). Исходная таблица data/ в git не хранится
# (в листе последовательности есть персональные данные) — положите её в ../data/ перед запуском.
input:
  data: ../../data/s266_table_for_calc.csv
  format: wide
  metadata: ../../metadata/metadata_stage2.csv
  id_column: Sample
  meta_columns: [Sample, Group, Diag]
  contaminant_series: ../../curation/contaminant_series.csv
  exposure_keywords: ../../curation/exposure_keywords.csv
output: ../../results_R
seed: 20261013
cores: 4
design:
  groups: [Control, BC, PC]
  qc_pattern: "^QC"
  blank_pattern: "^(blank|бланк|blk)"
  qc_every: 20                 # QC1 перед пробой 1, далее QC после каждых 20 инъекций
  comparisons:
    - {name: BC_vs_Control, case: BC, ref: Control}
    - {name: BC_vs_PC, case: BC, ref: PC}
    - {name: PC_vs_Control, case: PC, ref: Control}
    - {name: PC_vs_maleControl, case: PC, ref: Control, sex: M}
  covariates: [sex, age, contam_index]
  match_caliper_years: 5
  match_within_sex: true
preprocess:
  min_qc_detect: 0.8
  min_group_detect: 0.5
  max_qc_rsd: 0.30
  blank_ratio: 5
  drift: none                  # 6 QC: LOWESS почти не снижает ошибку (0.074 против 0.081)
  normalization: PQN
  compare_normalizations: [PQN, MSTUS]
  low_dilution_factor: 0.2
grouping: {rt_tol: 0.02, min_corr: 0.8, ppm: 5}
stats: {fdr: 0.05, confirm_p: 0.05, ctrl_index_p: 0.05}
multivariate: {cv_folds: 5, cv_repeats: 20, panel_k: 5, n_perm: 1000, max_abs_rho_contam: 0.5, min_pairs_cv: 10, run: true}
report: {fig_dpi: 300, top_boxplots: 12, heatmap_top: 50, html: true}
